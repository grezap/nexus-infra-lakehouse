#!/usr/sbin/nft -f
#
# lakehouse-iceberg-pg-node -- nftables ruleset (Phase 0.L.2 baseline; cold-clone
# safety net). The TF role-overlay-iceberg-nftables-backplane.tf is canonical.
#
# nic0 = VMnet11 (client :5432 via the keepalived VIP + VRRP between the pair),
# nic1 = VMnet10 (backplane: streaming replication). Per
# memory/feedback_cluster_template_nftables_backplane.md the VMnet10 trust rule
# is what makes streaming replication work; VRRP (proto 112) must be allowed on
# VMnet11 for the keepalived VIP failover (unicast).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"

        # Trust the VMnet10 cluster backplane (PostgreSQL streaming replication).
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"

        # Client access from the lab (VMnet11): PostgreSQL :5432 (via VIP .151)
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 5432 accept comment "PostgreSQL from VMnet11 (catalog DB)"

        # VRRP (proto 112) for the keepalived VIP failover (unicast between the pair).
        iifname "nic0" ip saddr 192.168.70.0/24 ip protocol vrrp accept comment "keepalived VRRP from VMnet11"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
