---
# lakehouse_iceberg_rest role -- install JDK 21 + the Project Nessie
# quarkus-runner JAR + the systemd unit (DISABLED -- the Terraform
# nessie-config overlay renders /etc/nexus-iceberg-rest/nessie.env with the
# JDBC datasource (iceberg-db VIP), the S3 warehouse (MinIO), and TLS, then
# enables + starts both instances).

# ─── JDK ──────────────────────────────────────────────────────────────────
- name: Install JDK for Nessie/Quarkus
  ansible.builtin.apt:
    name: "{{ lakehouse_jdk_package }}"
    state: present
    update_cache: true
  environment:
    DEBIAN_FRONTEND: noninteractive

# ─── Nessie system account ────────────────────────────────────────────────
- name: Create iceberg group
  ansible.builtin.group:
    name: "{{ lakehouse_nessie_group }}"
    system: true

- name: Create nessie user
  ansible.builtin.user:
    name: "{{ lakehouse_nessie_user }}"
    group: "{{ lakehouse_nessie_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: "{{ lakehouse_nessie_home }}"
    create_home: true

# useradd creates the home 0700 (Debian HOME_MODE); make it traversable so the
# JAR is readable by ops + the packer post-install check (run as nexusadmin).
- name: Ensure {{ lakehouse_nessie_home }} is traversable (0755)
  ansible.builtin.file:
    path: "{{ lakehouse_nessie_home }}"
    state: directory
    owner: "{{ lakehouse_nessie_user }}"
    group: "{{ lakehouse_nessie_group }}"
    mode: "0755"

# ─── Download the Nessie quarkus-runner JAR ───────────────────────────────
- name: Download Project Nessie quarkus-runner JAR
  ansible.builtin.get_url:
    url: "{{ lakehouse_nessie_download_url }}"
    dest: "{{ lakehouse_nessie_home }}/nessie-quarkus-runner.jar"
    owner: "{{ lakehouse_nessie_user }}"
    group: "{{ lakehouse_nessie_group }}"
    mode: "0644"
    timeout: 600

# ─── Per-node dirs (identity + TLS) ──────────────────────────────────────
- name: Create per-node Nessie directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: "{{ lakehouse_nessie_group }}"
    mode: "0750"
  loop:
    - "{{ lakehouse_nessie_identity_dir }}"
    - "{{ lakehouse_nessie_identity_dir }}/tls"

# ─── nexus-nessie.service (DISABLED at bake) ─────────────────────────────
- name: Install nexus-nessie.service systemd unit
  ansible.builtin.template:
    src: nexus-nessie.service.j2
    dest: /etc/systemd/system/nexus-nessie.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Ensure nexus-nessie.service is disabled at bake
  ansible.builtin.systemd:
    name: nexus-nessie.service
    enabled: false
    daemon_reload: true

# ─── Verify ──────────────────────────────────────────────────────────────
- name: Verify Nessie JAR + Java present
  ansible.builtin.command: "{{ item }}"
  changed_when: false
  loop:
    - "test -s {{ lakehouse_nessie_home }}/nessie-quarkus-runner.jar"
    - "/usr/lib/jvm/java-21-openjdk-amd64/bin/java -version"

- name: Show Nessie install summary
  ansible.builtin.debug:
    msg: "Project Nessie {{ lakehouse_nessie_version }} JAR installed at {{ lakehouse_nessie_home }}; JDK 21; service DISABLED until overlay apply"
