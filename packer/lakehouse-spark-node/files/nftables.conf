#!/usr/sbin/nft -f
#
# lakehouse-spark-node -- nftables ruleset (Phase 0.L.3 baseline; cold-clone
# safety net). The TF role-overlay-spark-nftables-backplane.tf is canon.
#
# One image serves both Spark roles, so the baseline opens all Spark service
# ports on VMnet11 (the unused role simply doesn't listen):
#   nic0 = VMnet11 (master RPC :7077; master UI :8080; worker UI :8081)
#   nic1 = VMnet10 (backplane; Spark<->ZooKeeper election + master<->worker)

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept
        ct state { established, related } accept
        ct state invalid drop
        ip protocol icmp   accept
        ip6 nexthdr icmpv6 accept

        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 22   accept comment "SSH from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 9100 accept comment "node_exporter from VMnet11"
        iifname "nic1" ip saddr 192.168.10.0/24 accept comment "trusted cluster backplane (VMnet10)"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 7077 accept comment "Spark master RPC from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 8080 accept comment "Spark master Web UI from VMnet11"
        iifname "nic0" ip saddr 192.168.70.0/24 tcp dport 8081 accept comment "Spark worker Web UI from VMnet11"
        iifname "nic0" ip saddr { 192.168.70.140, 192.168.70.153, 192.168.70.145, 192.168.70.146, 192.168.70.154 } accept comment "Spark cluster-peer RPC (dynamic driver/blockManager ports, 5 Spark nodes)"

        counter drop
    }
    chain forward { type filter hook forward priority 0; policy drop; }
    chain output  { type filter hook output priority 0; policy accept; }
}
