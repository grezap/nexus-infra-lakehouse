---
# lakehouse_spark role defaults
lakehouse_spark_version: "3.5.3"
lakehouse_spark_download_url: "https://archive.apache.org/dist/spark/spark-3.5.3/spark-3.5.3-bin-hadoop3.tgz"
lakehouse_iceberg_runtime_url: "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-spark-runtime-3.5_2.12/1.7.1/iceberg-spark-runtime-3.5_2.12-1.7.1.jar"
lakehouse_iceberg_aws_bundle_url: "https://repo1.maven.org/maven2/org/apache/iceberg/iceberg-aws-bundle/1.7.1/iceberg-aws-bundle-1.7.1.jar"
lakehouse_hadoop_aws_url: "https://repo1.maven.org/maven2/org/apache/hadoop/hadoop-aws/3.3.4/hadoop-aws-3.3.4.jar"
lakehouse_aws_sdk_bundle_url: "https://repo1.maven.org/maven2/com/amazonaws/aws-java-sdk-bundle/1.12.262/aws-java-sdk-bundle-1.12.262.jar"
lakehouse_jdk_package: "openjdk-21-jre-headless"

lakehouse_spark_user: spark
lakehouse_spark_group: spark
lakehouse_spark_home: /opt/spark
lakehouse_spark_data_dir: /var/lib/spark
lakehouse_spark_log_dir: /var/log/spark
lakehouse_spark_identity_dir: /etc/nexus-spark
